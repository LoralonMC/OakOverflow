plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("me.clip:placeholderapi:2.11.6")
    compileOnly(fileTree(dir: 'libs', include: ['*.jar'])) // PhoenixCratesPro API (not on Maven Central)
    implementation("dev.oakheart:oakheart-core:1.2.0")
    implementation("org.bstats:bstats-bukkit:3.1.0")
    compileOnly("org.xerial:sqlite-jdbc:3.47.1.0")
    compileOnly("com.mysql:mysql-connector-j:9.1.0")
    compileOnly("com.zaxxer:HikariCP:6.2.1")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate("org.bstats", "dev.oakheart.oakoverflow.bstats")
    relocate("dev.oakheart.config", "dev.oakheart.oakoverflow.libs.config")
    relocate("dev.oakheart.message", "dev.oakheart.oakoverflow.libs.message")
    relocate("dev.oakheart.command", "dev.oakheart.oakoverflow.libs.command")
    relocate("dev.oakheart.util", "dev.oakheart.oakoverflow.libs.util")
}

jar {
    archiveClassifier.set('slim')
}

tasks.assemble.dependsOn(tasks.shadowJar)
